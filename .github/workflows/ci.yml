name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUDIT_TEST_DATABASE_URL: postgresql://audit_test:ci-test-only@localhost:5432/audit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m unittest discover -s tests -v
      - name: Check public export boundary
        if: ${{ hashFiles('scripts/export_public.py') != '' }}
        run: python scripts/export_public.py "$RUNNER_TEMP/public-check"
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anime-downloader-check .
      - run: docker run --rm anime-downloader-check python -c "import animedl.services; import animedl.download.splitter"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.botapi
          load: true
          tags: anime-bot-api-check
          cache-from: type=gha,scope=botapi-native
          cache-to: type=gha,mode=max,scope=botapi-native
      - run: docker run --rm --entrypoint telegram-bot-api anime-bot-api-check --version

      - name: Export verified Bot API binary
        run: |
          mkdir -p "$RUNNER_TEMP/botapi-native"
          container_id=$(docker create anime-bot-api-check)
          docker cp "$container_id:/usr/local/bin/telegram-bot-api" "$RUNNER_TEMP/botapi-native/telegram-bot-api"
          docker cp "$container_id:/usr/local/share/botapi-build.json" "$RUNNER_TEMP/botapi-native/manifest.json"
          docker rm "$container_id"
          python3 -c "import json,hashlib,os;from pathlib import Path;p=Path(os.environ['RUNNER_TEMP'])/'botapi-native';m=json.loads((p/'manifest.json').read_text());assert m['idle_timeout']==7200;assert hashlib.sha256((p/'telegram-bot-api').read_bytes()).hexdigest()==m['sha256']"
      - uses: actions/upload-artifact@v4
        with:
          name: botapi-native-linux-amd64
          path: ${{ runner.temp }}/botapi-native/
          retention-days: 3
