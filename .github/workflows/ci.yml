name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUDIT_TEST_DATABASE_URL: postgresql://audit_test:ci-test-only@localhost:5432/audit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m unittest discover -s tests -v
      - name: Check public export boundary
        if: ${{ hashFiles('scripts/export_public.py') != '' }}
        run: python scripts/export_public.py "$RUNNER_TEMP/public-check"
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anime-downloader-check .
      - run: docker run --rm anime-downloader-check python -c "import animedl.services; import animedl.download.splitter"
      - run: docker build -f Dockerfile.botapi -t anime-bot-api-check .
