name: Build upload-capable Bot API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.botapi
          target: binary-export
          outputs: type=local,dest=/tmp/botapi-binary
          cache-from: type=gha,scope=botapi-native
          cache-to: type=gha,mode=max,scope=botapi-native
      - uses: actions/upload-artifact@v4
        with:
          name: botapi-native-linux-amd64
          path: /tmp/botapi-binary/
          retention-days: 3
