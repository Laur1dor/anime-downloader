# Optional owner-only media folder. Mount your NAS on the host first.
# docker compose -f compose.yml -f compose.library.yml up -d
services:
  bot:
    environment:
      LIBRARY_DIR: /app/library
      MEDIA_ROOT: ${MEDIA_ROOT:-}
      TELEGRAM_API_LOCAL_MODE: "1"
      TELEGRAM_LOCAL_FILE_ROOT: /app/media/.animedl-work
    volumes:
      - type: bind
        source: ${LIBRARY_HOST_DIR:?set LIBRARY_HOST_DIR to an existing mounted media folder}
        target: /app/library
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HOST_ROOT:-${LIBRARY_HOST_DIR}}
        target: /app/media
        bind:
          create_host_path: false

  telegram-bot-api:
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - type: bind
        source: ${MEDIA_HOST_ROOT:-${LIBRARY_HOST_DIR}}/.animedl-work
        target: /app/media/.animedl-work
        read_only: true
        bind:
          create_host_path: false
